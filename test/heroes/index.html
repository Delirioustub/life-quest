<title>Life Quest v16 - 3D hero preview</title>
<style>
  :root { --bg:#0b0d1a; --card:#151a33; --line:#2a3160; --ink:#e8ecff; --mut:#9aa3d6; --tier:#8a5cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 16px 6px; } h1 { font-size:17px; margin:0 0 2px; } .mut { color:var(--mut); font-size:12px; }
  .hero { display:flex; gap:12px; align-items:center; margin:10px 16px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .frame { position:relative; flex:none; border-radius:12px; background:radial-gradient(ellipse at 50% 35%,#24306a,#0f1330 70%); border:2px solid var(--tier); box-shadow:0 0 18px -4px var(--tier); overflow:visible; cursor:pointer; touch-action:manipulation; }
  .frame canvas { display:block; width:100%; height:100%; border-radius:10px; }
  .big { width:132px; height:198px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 16px 20px; }
  .cell { text-align:center; } .cell .frame { width:84px; height:126px; margin:0 auto; } .cell .nm { font-size:11px; color:var(--mut); margin-top:4px; }
  .cell.sel .frame { --tier:#ffc94a; }
  .pop { position:absolute; left:50%; top:-6px; transform:translateX(-50%); font-size:18px; pointer-events:none; animation:pop 1s ease-out forwards; }
  @keyframes pop { 0% { opacity:0; transform:translate(-50%,6px) scale(.5); } 20% { opacity:1; transform:translate(-50%,-6px) scale(1.15); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-18px); } }
  .info b { display:block; font-size:16px; } .info .mut { margin-top:4px; }
  .row { margin:0 16px 8px; display:flex; gap:8px; } .row button { all:unset; cursor:pointer; padding:7px 12px; border-radius:999px; background:#1d2346; border:1px solid var(--line); font-size:12px; }
  .row button.on { background:#3a2a8a; border-color:#8a5cff; }

<body>

<div class="grid" id="grid"></div>

w": 512, "full_h": 768}, "idle": {"256": {"full_w": 256, "full_h": 384, "sheet": "masc_starter_idle_256.webp", "anim": "masc_starter_idle_256_anim.webp", "w": 228, "h": 340, "cols": 8, "frames": 24, "fps": 12, "sheet_kb": 116.8, "anim_kb": 128.4}, "512": {"full_w": 512, "full_h": 768, "sheet": "masc_starter_idle_512.webp", "anim": "masc_starter_idle_512_anim.webp", "w": 456, "h": 680, "cols": 8, "frames": 24, "fps": 12, "sheet_kb": 190.9, "anim_kb": 199.1}}, "tap": {"256": {"full_w": 256, "full_h": 384, "sheet": "masc_starter_tap_256.webp", "anim": "masc_starter_tap_256_anim.webp", "w": 228, "h": 340, "cols": 8, "frames": 17, "fps": 20, "sheet_kb": 98.1, "anim_kb": 105.0}, "512": {"full_w": 512, "full_h": 768, "sheet": "masc_starter_tap_512.webp", "anim": "masc_starter_tap_512_anim.webp", "w": 456, "h": 680, "cols": 8, "frames": 17, "fps": 20, "sheet_kb": 163.6, "anim_kb": 159.0}}}, "masc_warrior": {"crop": {"x": 0.0, "y": 0.0, "w": 0.9375, "h": 1.0, "full_w": 512, "full_h": 768}, "idle": {"256": {"full_w": 256, "full_h": 384, "sheet": "masc_warrior_idle_256.webp", "anim": "masc_warrior_idle_256_anim.webp", "w": 240, "h": 384, "cols": 8, "frames": 24, "fps": 12, "sheet_kb": 135.0, "anim_kb": 152.4}, "512": {"full_w": 512, "full_h": 768, "sheet": "masc_warrior_idle_512.webp", "anim": "masc_warrior_idle_512_anim.webp", "w": 480, "h": 768, "cols": 8, "frames": 24, "fps": 12, "sheet_kb": 235.4, "anim_kb": 252.9}}, "tap": {"256": {"full_w": 256, "full_h": 384, "sheet": "masc_warrior_tap_256.webp", "anim": "masc_warrior_tap_256_anim.webp", "w": 240, "h": 384, "cols": 8, "frames": 17, "fps": 20, "sheet_kb": 109.6, "anim_kb": 116.2}, "512": {"full_w": 512, "full_h": 768, "sheet": "masc_warrior_tap_512.webp", "anim": "masc_warrior_tap_512_anim.webp", "w": 480, "h": 768, "cols": 8, "frames": 17, "fps": 20, "sheet_kb": 193.3, "anim_kb": 191.2}}}};
const NAMES = { starter:'Starter', warrior:'Warrior', mage:'Mage' };
let RES = 'auto';
const imgs = {};
function sheet(ch, anim, w) { const k = ch + anim + w; if (!imgs[k]) { const im = new Image(); im.src = 'anim/' + META[ch][anim][w].sheet; imgs[k] = im; } return imgs[k]; }
function pickW(cssW) { if (RES !== 'auto') return RES; return cssW * (window.devicePixelRatio || 1) > 300 ? '512' : '256'; }
class Player {
  constructor(canvas, ch) { this.c = canvas; this.ctx = canvas.getContext('2d'); this.ch = ch; this.anim = 'idle'; this.t0 = performance.now(); this.fit(); }
  fit() { const r = this.c.getBoundingClientRect(), d = window.devicePixelRatio || 1; this.c.width = Math.round(r.width * d); this.c.height = Math.round(r.height * d); this.w = pickW(r.width); }
  tap() { this.anim = 'tap'; this.t0 = performance.now(); const p = document.createElement('span'); p.className = 'pop'; p.textContent = '\u2728'; this.c.parentNode.appendChild(p); setTimeout(() => p.remove(), 1000); }
  draw(now) {
    const m = META[this.ch][this.anim][this.w]; let f = Math.floor((now - this.t0) / 1000 * m.fps);
    if (this.anim === 'tap' && f >= m.frames) { this.anim = 'idle'; this.t0 = now; return this.draw(now); }
    f = ((f % m.frames) + m.frames) % m.frames;
    const im = sheet(this.ch, this.anim, this.w); if (!im.complete) return;
    const sx = (f % m.cols) * m.w, sy = Math.floor(f / m.cols) * m.h, cw = this.c.width, chh = this.c.height;
    this.ctx.clearRect(0, 0, cw, chh);
    // sheets hold a tight crop of the full portrait frame; place it back where it sits in the full frame
    const cr = META[this.ch].crop, s = Math.min(cw / m.full_w, chh / m.full_h), fx = (cw - m.full_w * s) / 2, fy = chh - m.full_h * s;
    this.ctx.imageSmoothingQuality = 'high';
    this.ctx.drawImage(im, sx, sy, m.w, m.h, fx + cr.x * m.full_w * s, fy + cr.y * m.full_h * s, m.w * s, m.h * s);
  }

const players = []; let bigP = null;
function setBig(ch) {
  document.querySelectorAll('.cell').forEach(c => c.classList.toggle('sel', c.dataset.ch === ch));

  const m = META[ch]; document.getElementById('bigmeta').textContent = `idle ${m.idle['256'].frames}f @${m.idle['256'].fps}fps · tap ${m.tap['256'].frames}f @${m.tap['256'].fps}fps`;

const grid = document.getElementById('grid');
Object.keys(META).sort((a, b) => (a.split('_')[0] < b.split('_')[0] ? 1 : -1) || 0).forEach(ch => {

  const [sex, set] = ch.split('_');

  cell.querySelector('.frame').addEventListener('click', () => { p.tap(); setBig(ch); bigP.tap(); });
});
document.getElementById('bigf').addEventListener('click', () => bigP && bigP.tap());
setBig(Object.keys(META).find(k => k === 'masc_warrior') || Object.keys(META)[0]);

(function loop(now) { players.forEach(p => p.draw(now)); requestAnimationFrame(loop); })(performance.now());
