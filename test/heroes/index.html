<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Quest · v19c hero sprites</title>
<style>body{background:#0f1330;color:#e8e8f4;font:14px system-ui;margin:0;padding:16px}h1{font-size:18px}.row{margin:8px 0}label{display:inline-block;width:90px;color:#9aa}
button,select{background:#1d2450;color:#fff;border:1px solid #3a4580;border-radius:6px;padding:4px 8px;margin:2px}.sw{width:22px;height:22px;border-radius:50%;display:inline-block;margin:2px;cursor:pointer;border:2px solid #0000}.sw.on{border-color:#fff}
.stage{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}.box{background:#1a2048;border-radius:12px;padding:8px;text-align:center}canvas{display:block;image-rendering:auto}
#grid canvas{width:84px;height:161px;object-fit:contain}</style></head><body>
<h1>Life Quest hero sprites v19c (layered: base + tinted skin + tinted hair)</h1>
<div class="row"><label>Sex</label><select id="sex"><option value="masc">masculine</option><option value="fem">feminine</option></select></div>
<div class="row"><label>Outfit</label><select id="set"><option>starter</option><option>warrior</option><option>mage</option><option value="dawn">Dawnforged (legendary)</option><option value="archive">Quiet Archive (legendary)</option><option value="shadow">Shadowstep (legendary)</option></select></div>
<div class="row"><label>Hair</label><select id="hair"></select></div>
<div class="row"><label>Hair colour</label><span id="hc"></span></div>
<div class="row"><label>Skin</label><span id="sk"></span></div>
<div class="row"><button id="tap">Tap (play tap animation)</button> <span id="info" style="color:#9aa"></span></div>
<div class="stage"><div class="box"><canvas id="big" style="height:420px"></canvas>large</div><div class="box"><canvas id="mid" style="height:161px"></canvas>app size</div><div class="box"><canvas id="sm" style="height:64px"></canvas>64 px</div></div>
<h3>All outfits (current hair / colours)</h3><div id="grid" class="stage"></div>
<script>
const B='../../assets/heroes/v19c/', HC=['#14101c','#2a2140','#3b2a20','#6b3e1f','#8a5a2b','#c8873a','#e8d27a','#b23a3a','#d06a3a','#6a6a72','#9a9aa2','#d8d8dc','#cfd6ff','#4a6ac8'],
SK=['#fbe3cf','#f6d2b0','#f0c29a','#e6b48a','#d9a066','#c68a55','#b5774a','#a8693d','#8d5532','#76462a','#6e4126','#5a3520','#47291a','#352015'];
let MF, st={sex:'masc',set:'starter',hair:'textured_crop',hc:'#3b2a20',sk:'#e6b48a'}, tap=0; const IM={}, TI={};
const load=u=>IM[u]||(IM[u]=Object.assign(new Image(),{src:B+u+'.webp'}));
const tint=(u,c)=>{const k=u+c; if(TI[k])return TI[k]; const e=load(u); if(!e.complete||!e.naturalWidth)return null; const cv=document.createElement('canvas'); cv.width=e.naturalWidth; cv.height=e.naturalHeight; const x=cv.getContext('2d'); x.drawImage(e,0,0); x.globalCompositeOperation='multiply'; x.fillStyle=c; x.fillRect(0,0,cv.width,cv.height); x.globalCompositeOperation='destination-in'; x.drawImage(e,0,0); return TI[k]=cv;};
function draw(cv,ch,hair,which,fr){const m=MF.chars[ch]; if(!m)return; if(m.hair.indexOf(hair)<0&&hair!=='bald')hair=m.hair[0]; const p=ch+'/'+which+'_', b=load(p+'base'); if(!b.complete||!b.naturalWidth)return;
 const L=[b,tint(p+'skin',st.sk)].concat(hair==='bald'?[]:[tint(p+'hair-'+hair,st.hc)]); if(L.some(x=>!x))return; cv.width=m.w; cv.height=m.h; const x=cv.getContext('2d'); L.forEach(i=>x.drawImage(i,fr*m.w,0,m.w,m.h,0,0,m.w,m.h));}
function sw(id,list,key){const e=document.getElementById(id); e.innerHTML=list.map(c=>`<span class="sw${c===st[key]?' on':''}" style="background:${c}" data-c="${c}"></span>`).join(''); e.onclick=ev=>{if(ev.target.dataset.c){st[key]=ev.target.dataset.c; sw(id,list,key);}};}
fetch(B+'manifest.json').then(r=>r.json()).then(m=>{MF=m; const hs=['bald'].concat(m.chars.masc_starter.hair); hair.innerHTML=hs.map(h=>`<option ${h===st.hair?'selected':''}>${h}</option>`).join('');
 sw('hc',HC,'hc'); sw('sk',SK,'sk'); ['sex','set','hair'].forEach(k=>document.getElementById(k).onchange=e=>st[k]=e.target.value); document.getElementById('tap').onclick=()=>tap=performance.now();
 const g=document.getElementById('grid'); ['starter','warrior','mage','dawn','archive','shadow'].forEach(s=>{const c=document.createElement('canvas'); c.dataset.set=s; g.appendChild(c);});
 let kb=0; Object.keys(IM).length; setInterval(()=>{const now=performance.now(), F=MF.fps, N=MF.n; let which='idle', fr=Math.floor(now/1000*F.idle)%N.idle;
  if(now-tap<N.tap/F.tap*1000){which='tap'; fr=Math.min(N.tap-1,Math.floor((now-tap)/1000*F.tap));}
  const ch=st.sex+'_'+st.set; ['big','mid','sm'].forEach(id=>draw(document.getElementById(id),ch,st.hair,which,fr));
  g.querySelectorAll('canvas').forEach(c=>draw(c,st.sex+'_'+c.dataset.set,st.hair,'idle',fr));
  info.textContent=ch+' · hair '+st.hair+(MF.chars[ch]&&MF.chars[ch].hair.length===1?' (tucked under the hood)':'');},1000/12);});
</script></body></html>
